const places = [
['Alcatraz','San Francisco, USA','North America','History','Alcatraz Island','An island with an unforgettable past.','Alcatraz is a small island in San Francisco Bay. It is best known for the former federal prison that once stood there. The island also tells stories about military history and Native American activism.','The prison buildings and the bay around them make Alcatraz one of San Francisco’s most recognisable places. Looking back towards the city, visitors can see how close the island is to everyday life, yet how isolated it must have felt.','https://www.nps.gov/alca/'],
['Big Ben','London, United Kingdom','Europe','Architecture','Big Ben','The sound of London.','Big Ben is the nickname of the Great Bell in the Elizabeth Tower at the Palace of Westminster. People often use the name for the whole clock tower. The tower stands beside the River Thames and is one of London’s best-known symbols.','The clock faces, Gothic details and familiar chimes connect this landmark with British public life. Big Ben and the Palace of Westminster belong to the same complex, but this atlas explores them in separate entries.','https://www.parliament.uk/bigben/'],
['Central Park','New York City, USA','North America','Parks','Central Park','A green heart in a busy city.','Central Park is a large public park in Manhattan. Its paths, lakes, lawns and wooded areas give people a place to rest in the middle of New York City. It was designed as a landscape, rather than simply left as an area of wild nature.','The park is a meeting place for walkers, runners, musicians and families. Its contrast with the tall buildings around it is part of what makes it special.','https://www.centralparknyc.org/'],
['Downing Street','London, United Kingdom','Europe','History','Downing Street','A small street at the centre of power.','Downing Street is in Westminster, London. Number 10 is the official residence and office of the British Prime Minister. Its black front door often appears in news reports about the government.','The street shows how a fairly modest building can become a powerful national symbol. Public access to the street is restricted, so most visitors see its entrance from Whitehall.','https://www.gov.uk/government/history/10-downing-street'],
['Edinburgh Castle','Edinburgh, United Kingdom','Europe','History','Edinburgh Castle','A fortress above the city.','Edinburgh Castle stands on Castle Rock, high above the Scottish capital. Its buildings tell the story of royal life, defence and conflict in Scotland. The castle is a striking part of Edinburgh’s skyline.','The steep rock helped make this a strong defensive site. From below, the castle looks almost like an extension of the landscape itself.','https://www.edinburghcastle.scot/'],
["Fingal’s Cave",'Staffa, United Kingdom','Europe','Nature',"Fingal's Cave",'Where stone and the sea make music.',"Fingal’s Cave is a sea cave on the island of Staffa, off the west coast of Scotland. Its walls are formed from remarkable basalt columns. The movement of the sea and the shape of the cave create powerful natural sounds.",'The columns were formed as lava cooled. Their regular shapes can look man-made, but the cave is a natural landmark. It has inspired artists, writers and musicians.','https://www.nts.org.uk/visit/places/staffa'],
['Grand Canyon','Arizona, USA','North America','Nature','Grand Canyon','A landscape written in layers.','The Grand Canyon is a vast canyon in Arizona. The Colorado River and other natural processes have shaped this landscape over a very long time. Its exposed rock layers help scientists understand the history of the Earth.','Light changes the colours of the cliffs throughout the day. The canyon is also a place of deep cultural importance to Indigenous peoples.','https://www.nps.gov/grca/'],
['Hollywood Walk of Fame','Los Angeles, USA','North America','Culture','Hollywood Walk of Fame','Stories behind the stars.','The Hollywood Walk of Fame is a series of stars set into pavements in Hollywood. The stars honour people and groups connected with entertainment, including film, television, music and radio.','Unlike a museum behind closed doors, this landmark is part of the street. It connects the everyday city with the world of famous performers and their work.','https://walkoffame.com/'],
['Independence Hall','Philadelphia, USA','North America','History','Independence Hall','A building connected with a nation’s beginnings.','Independence Hall is a historic building in Philadelphia. The Declaration of Independence and the United States Constitution were debated and adopted here. It is one of the most important places in American political history.','The building’s rooms help visitors imagine the discussions that shaped the new country. Its importance comes from both its architecture and the ideas associated with it.','https://www.nps.gov/inde/'],
['Jedburgh Abbey','Jedburgh, United Kingdom','Europe','History','Jedburgh Abbey','History in the Scottish Borders.','Jedburgh Abbey is a ruined medieval abbey in the Scottish Borders. Its surviving stone walls, arches and windows reveal the scale of the original church. Romanesque and Gothic features can both be seen in its architecture.','Even without a complete roof, the building keeps a strong sense of space. Its ruins are a reminder of the religious communities that helped shape medieval Scotland.','https://www.historicenvironment.scot/visit-a-place/places/jedburgh-abbey/'],
['Kensington Palace','London, United Kingdom','Europe','History','Kensington Palace','Royal stories beside the gardens.','Kensington Palace is a royal residence in London, next to Kensington Gardens. It has been home to several generations of the British royal family. Parts of the palace contain exhibitions about royal life and history.','The palace combines private royal life with public spaces and gardens. Its relatively quiet surroundings offer a different view of London from the busy streets nearby.','https://www.hrp.org.uk/kensington-palace/'],
['London Eye','London, United Kingdom','Europe','Architecture','London Eye','A new perspective on London.','The London Eye is a large observation wheel on the South Bank of the River Thames. Its passenger capsules offer wide views across central London. It stands opposite the Westminster area.','The wheel has become an important modern landmark in a city known for historic buildings. Its slow movement gives visitors time to recognise familiar places from above.','https://www.londoneye.com/'],
['Metropolitan Museum of Art','New York City, USA','North America','Culture','Metropolitan Museum of Art','Art across time and cultures.','The Metropolitan Museum of Art, often called the Met, is a major art museum in New York City. Its collection brings together objects and artworks from many parts of the world and many periods of history.','The main building stands beside Central Park. Moving through its galleries can feel like travelling between different societies, artistic traditions and centuries.','https://www.metmuseum.org/'],
['National Gallery','London, United Kingdom','Europe','Culture','National Gallery','Looking closely at great paintings.','The National Gallery is an art museum in Trafalgar Square, London. It is known for its collection of European paintings. Its galleries allow visitors to compare artists, styles and subjects from different periods.','A painting can tell us about the people who made it and the society in which they lived. The gallery is a place to practise looking carefully and asking questions about art.','https://www.nationalgallery.org.uk/'],
['Oxford','Oxford, United Kingdom','Europe','Education','Oxford','A city built around learning.','Oxford is a historic city in England, famous for the University of Oxford. Its colleges, libraries and courtyards are closely connected with the life of the city. Oxford is sometimes called the city of dreaming spires.','Oxford is a city, rather than one individual building. In this atlas, the entry celebrates its distinctive mixture of academic traditions, streets and architecture.','https://www.ox.ac.uk/visitors'],
['Palace of Westminster','London, United Kingdom','Europe','Architecture','Palace of Westminster','Architecture beside the Thames.','The Palace of Westminster is the meeting place of the United Kingdom Parliament. It stands on the north bank of the River Thames. Its Gothic Revival architecture makes it one of the most distinctive buildings in London.','The palace is associated with the work of the House of Commons and the House of Lords. The Elizabeth Tower, home to Big Ben, forms part of the complex.','https://www.parliament.uk/visiting/'],
['Queen Elizabeth Olympic Park','London, United Kingdom','Europe','Parks','Queen Elizabeth Olympic Park','The life of a park after the Games.','Queen Elizabeth Olympic Park is in east London. It is closely associated with the London 2012 Olympic and Paralympic Games. The area includes parkland, waterways and major sporting venues.','The park shows how an Olympic site can become part of everyday city life. People can explore its open spaces and discover buildings created for international sport.','https://www.queenelizabetholympicpark.co.uk/'],
['Roman Baths','Bath, United Kingdom','Europe','History','Roman Baths (Bath)','An ancient world around hot springs.','The Roman Baths are an ancient bathing and religious complex in the city of Bath. The Romans built around natural hot springs that still flow today. The site helps explain how water, health and religion were connected in Roman society.','The Great Bath is one of the most recognisable parts of the complex. The archaeological site is a place to explore history, rather than a swimming pool for visitors.','https://www.romanbaths.co.uk/'],
['Statue of Liberty','New York Harbor, USA','North America','History','Statue of Liberty','A symbol of freedom and welcome.','The Statue of Liberty stands on Liberty Island in New York Harbor. It was a gift from the people of France to the people of the United States. The figure holds a torch and has become a widely recognised symbol of liberty.','For many people arriving by sea, the statue represented the hope of a new beginning. Its meaning connects art, friendship between countries and the history of immigration.','https://www.nps.gov/stli/'],
['Times Square','New York City, USA','North America','Culture','Times Square','The energy of New York.','Times Square is a busy area in Midtown Manhattan. It is famous for bright advertising screens, theatres and large crowds. It is also closely connected with New Year’s Eve celebrations in New York City.','This is a landmark made from movement, light and public space. Its atmosphere changes throughout the day, but its illuminated signs make it especially recognisable at night.','https://www.timessquarenyc.org/'],
['University College London','London, United Kingdom','Europe','Education','University College London','A place for ideas in the capital.','University College London, usually called UCL, is a university in London. Its historic main campus is in Bloomsbury. The main building’s classical columns and dome are well-known features of the university.','UCL connects the history of higher education with modern research and student life. It is an educational institution, rather than a single tourist attraction.','https://www.ucl.ac.uk/'],
['Venice Beach','Los Angeles, USA','North America','Culture','Venice, Los Angeles','Where the city meets the Pacific.','Venice Beach is a well-known coastal area in Los Angeles. It is associated with a long sandy beach, a lively oceanfront walk, skateboarding and outdoor sport. Street performers and artists are part of its public atmosphere.','The beach shows a different side of Los Angeles from Hollywood. Here, the ocean and outdoor spaces are central to the identity of the neighbourhood.','https://www.discoverlosangeles.com/visit/venice'],
['Westminster Abbey','London, United Kingdom','Europe','History','Westminster Abbey','A church at the heart of British history.','Westminster Abbey is a historic church in central London. It is associated with coronations, royal ceremonies and the burial or commemoration of many important figures. Its Gothic architecture creates a striking interior.','The abbey is still a working church. It stands close to the Palace of Westminster, but the two are separate buildings with different purposes.','https://www.westminster-abbey.org/'],
['Xavier College','Kew, Melbourne, Australia','Oceania','Education','Xavier College','Learning and heritage in Melbourne.','Xavier College is a Jesuit school in Melbourne, Australia. Its Kew campus combines historic buildings with modern educational facilities. The school is part of the wider tradition of Jesuit education.','This entry refers to Xavier College in Kew, Melbourne. The campus connects school life with the architectural and educational history of the local area.','https://xavier.vic.edu.au/about-xavier/xavier-history'],
['York Minster','York, United Kingdom','Europe','Architecture','York Minster','Stone, glass and centuries of history.','York Minster is a large Gothic cathedral in the historic city of York. It is known for its architecture and stained-glass windows. The cathedral continues to be a centre of Christian worship.','Its towers rise above the surrounding streets. Its interior combines tall stone columns with detailed carvings and coloured light.','https://yorkminster.org/'],
['Zion National Park','Utah, USA','North America','Nature','Zion National Park','A landscape of sandstone and sky.','Zion National Park is in southwestern Utah. It is known for sandstone cliffs, deep canyons and the Virgin River. Its landscape includes a striking contrast between desert surroundings and greener areas near water.','The park offers a way to explore the relationship between rock, water and living things. Its canyon walls change in appearance as the light moves across them.','https://www.nps.gov/zion/']
].map((p,i)=>({name:p[0],location:p[1],region:p[2],type:p[3],wiki:p[4],subtitle:p[5],text:p[6],more:p[7],source:p[8],letter:String.fromCharCode(65+i),id:String.fromCharCode(97+i)}));
const extendedStories={"a":{"source":"https://www.nps.gov/alca/learn/historyculture/index.htm","sections":[["More than a prison","Before it became a federal prison, Alcatraz was a military fortress and a military prison. The federal prison operated from 1934 to 1963. Its position in the bay made it difficult to reach, while the cold water and strong currents made escape dangerous. However, the island’s story includes much more than famous criminals and attempted escapes."],["A different chapter","In 1969, Native American activists occupied Alcatraz to draw attention to Indigenous rights. The occupation continued until 1971 and became an important moment in modern American history. Today, the remaining buildings help people explore questions about punishment, freedom and justice. The island is also a home for seabirds, creating a surprising contrast between its natural life and its prison walls."]]},"b":{"source":"https://www.parliament.uk/about/living-heritage/building/palace/big-ben/building-clock-tower/key-dates-/","sections":[["Building a national symbol","The present clock tower was built as part of the new Palace of Westminster after the great fire of 1834. The Great Clock began working in 1859, and the Great Bell first sounded that July. The bell developed a crack, but a change to its position and hammer allowed it to continue striking. That history is part of its distinctive sound."],["Look beyond the clock","The tower combines practical engineering with elaborate decoration. The four clock faces allow people to read the time from different directions. Below them, the palace stretches along the river, while Westminster Bridge offers a familiar view of the whole scene. Big Ben is both a useful public clock and a landmark whose sound is associated with major national moments."]]},"c":{"source":"https://www.centralparknyc.org/park-history","sections":[["A carefully designed landscape","Frederick Law Olmsted and Calvert Vaux designed Central Park in the nineteenth century. Their plan included broad lawns, winding paths, lakes and woodland. Although many areas look natural, they were carefully arranged to create different experiences. The project also displaced people who had lived on the land, including residents of Seneca Village, a significant African-American community."],["A place for people and wildlife","Central Park is important for more than sightseeing. Its trees provide shade, its open spaces support recreation, and its habitats give birds somewhere to rest during migration. Different sections have different moods: a busy path can lead to a quiet wooded area. The park shows how thoughtful landscape design can give a crowded city space to breathe."]]},"d":{"source":"https://www.gov.uk/government/history/10-downing-street","sections":[["Behind the black door","Number 10 has served British prime ministers since the eighteenth century. Its familiar front hides a much larger complex of rooms, corridors and staircases. The building combines three roles: a home, a workplace and a setting for official hospitality. Meetings with ministers and international guests take place behind a doorway that looks much simpler than many royal or government entrances."],["Why the address matters","In news reports, the words Downing Street can refer to the Prime Minister’s office rather than just the physical street. Important announcements are often made outside Number 10, making its front door a recognisable backdrop to political events. Nearby Whitehall contains other government buildings. Together, these streets help explain why Westminster is closely connected with the work of the British state."]]},"e":{"source":"https://www.edinburghcastle.scot/the-castle/history/","sections":[["A stronghold with many roles","People recognised the defensive value of Castle Rock long before the present buildings existed. Over the centuries, the castle became a royal home, a military base and a prison. Its position allowed defenders to watch the surrounding area, but it also made the fortress an important target. Repeated sieges and rebuilding helped shape the complex that can be seen today."],["Details that reveal the past","The buildings inside the castle come from different periods. St Margaret’s Chapel is particularly old, while the Great Hall reflects the ceremonial side of royal life. Cannons and defensive walls tell a different story about military power. Walking between these spaces reveals how a castle could serve practical, political and religious purposes at the same time."]]},"f":{"source":"https://www.nts.org.uk/visit/places/staffa","sections":[["How nature made the columns","Staffa’s rock columns formed when ancient lava cooled and cracked. Many of the columns have six sides, creating patterns that seem almost architectural. The sea gradually wore away part of the rock and helped form the cave. Its appearance is therefore the result of two very different forces: the heat of volcanic activity and the movement of water."],["A landscape that inspired music","The sound of waves echoes inside the cave, giving the place an unusual atmosphere. The composer Felix Mendelssohn was inspired by Staffa when he created his Hebrides Overture. The island also supports seabirds, including puffins. Its combination of geology, wildlife and sound makes it a useful reminder that a natural landmark can be experienced through more than sight alone."]]},"g":{"source":"https://www.nps.gov/grca/learn/nature/geologicformations.htm","sections":[["Reading the rock layers","The canyon’s walls contain layers formed in different ancient environments. Some materials were deposited by water, while other rocks record much older geological events. Later, uplift raised the region, and rivers cut into it. The age of the rocks and the age of the canyon are not the same thing: old rock can become visible when a much younger landscape develops around it."],["A changing view","From a distance, the canyon may seem still, but natural processes continue to change it. Water, weather and gravity break down and move material. Shadows also transform the view, revealing shapes that are difficult to notice in bright midday light. The canyon helps visitors understand the meaning of geological time, when changes too slow to notice in one day can eventually create an enormous landscape."]]},"h":{"source":"https://walkoffame.com/history/","sections":[["How the idea developed","Hollywood business leaders developed the idea in the 1950s as a way to celebrate entertainment and improve the appearance of the area. Construction began in 1960, and the first permanent star installed in the new Walk honoured film producer Stanley Kramer. The project turned ordinary pavement into a public collection of names connected with popular culture."],["What the stars represent","A star includes a name and a small symbol connected with a field of entertainment. The Walk recognises work behind the scenes as well as famous faces seen on screen. It is therefore possible to discover people whose names are unfamiliar but whose work has influenced films, programmes or music. The streets remain part of a working neighbourhood, so the landmark is experienced alongside everyday city life."]]},"i":{"source":"https://www.nps.gov/inde/learn/historyculture/places-independencehall.htm","sections":[["From state house to historic landmark","Construction began in 1732, when the building was intended to serve as the Pennsylvania State House. It later became a meeting place for leaders from the American colonies. The discussions held here in 1776 and 1787 helped produce two documents that changed the country’s political future: the Declaration of Independence and the Constitution."],["Ideas and their consequences","The Assembly Room is especially important because it places major historical events inside a real, human-sized space. The building invites questions about representation, government and individual rights. It also encourages people to consider the distance between the ideals expressed in founding documents and the lives of those excluded from them. Understanding both the achievements and the contradictions makes the site more meaningful."]]},"j":{"source":"https://www.historicenvironment.scot/visit/all/jedburgh-abbey/history-and-stories/","sections":[["A medieval community","King David I founded a religious community at Jedburgh in 1138, and it became an abbey in 1154. Its Augustinian canons followed a religious routine while also serving people beyond the abbey walls. Because the town was close to the English border, conflict repeatedly interrupted life there. Wars, attacks and religious change all contributed to the end of the medieval community."],["Reading the architecture","The church took many decades to build, and architectural fashions changed during that time. Rounded arches and strong cylindrical pillars reflect Romanesque design, while pointed arches show the developing Gothic style. Comparing these details helps visitors understand how one building can contain several stages of history. Even in ruins, its size and carefully arranged spaces reveal the ambition of its founders."]]},"k":{"source":"https://www.hrp.org.uk/kensington-palace/history-and-stories/the-story-of-kensington-palace/","sections":[["A retreat that became a palace","In 1689, William III and Mary II chose the house at Kensington as a retreat from central London. The earlier building was enlarged and adapted for royal use. Its setting offered a different environment from the crowded heart of the capital. Later generations changed the palace again, so its rooms reflect several periods of royal taste and daily life."],["Victoria’s childhood home","The future Queen Victoria was born at Kensington Palace in 1819 and spent her childhood there. This connection allows the palace to tell a personal story alongside the larger history of monarchy. Formal rooms show how royal status was presented, while accounts of family life reveal a more private world. The gardens also help explain the relationship between the residence and its surroundings."]]},"l":{"source":"https://www.londoneye.com/about-us/history/","sections":[["A wheel for the millennium","The London Eye opened to the public in March 2000. It was originally known as the Millennium Wheel and was planned as a temporary attraction, but it became a permanent part of the city. Rising 135 metres above the river, it introduced a striking modern structure beside some of London’s most historic buildings."],["Seeing the city as a whole","The wheel has 32 passenger capsules, and a full rotation takes about half an hour. Its slow movement creates a different experience from a fast fairground ride. As the view changes, visitors can connect individual landmarks with the wider city: the river, bridges, streets and parks become part of one landscape. The Eye is as much about understanding London’s layout as reaching a high viewpoint."]]},"m":{"source":"https://www.metmuseum.org/about-the-met","sections":[["A museum with a broad purpose","The Met was founded in 1870 to bring art and art education to the American public. Its collections now cover thousands of years and many cultures. Paintings share the museum with sculpture, ceramics, clothing, armour and other objects. This variety makes it possible to compare how people in different societies have expressed beliefs, power, beauty and everyday concerns."],["Learning to look carefully","A visit does not have to mean rushing through every gallery. Choosing a few objects and studying them closely can be more rewarding. The material, size and details of an object often reveal something about its original purpose. Museum labels provide context, while conservation work helps preserve fragile pieces. The Met is therefore both a place of display and a centre for research and care."]]},"n":{"source":"https://www.nationalgallery.org.uk/about-us/our-history","sections":[["From a private house to Trafalgar Square","The National Gallery began in 1824 with 38 paintings purchased from the collection of John Julius Angerstein. At first, visitors saw them in his former house in Pall Mall. The collection later moved to the purpose-built gallery in Trafalgar Square, which opened in 1838. Its history shows how a small beginning can develop into an important public institution."],["Different ways of seeing","The paintings include portraits, landscapes, religious scenes and images of everyday life. Looking at works from different periods reveals changes in clothing, artistic technique and ideas about the world. An artist may use light to direct attention or colour to create a particular mood. Comparing two paintings of a similar subject can be an especially useful way to notice these choices."]]},"o":{"source":"https://www.ox.ac.uk/about/the-university/history","sections":[["A university that grew over centuries","There is evidence of teaching at Oxford in 1096, although the university has no single clear foundation date. Colleges developed later as communities where scholars could live and study. The university is not one large building or a single enclosed campus. Its colleges, departments and libraries are spread through the city, creating a close relationship between academic life and the surrounding streets."],["Exploring the city’s character","College gateways, courtyards and towers help give Oxford its distinctive appearance. Some spaces feel public and busy, while others are quiet and enclosed. Bookshops, museums and rivers add different sides to the city. Oxford’s importance comes not only from its age, but also from the continuing activity of teaching and research inside its historic surroundings."]]},"p":{"source":"https://www.parliament.uk/about/living-heritage/building/palace/architecture/palacestructure/the-architects/","sections":[["Rebuilding after the fire","A major fire in 1834 destroyed much of the earlier palace. Charles Barry designed the replacement, with Augustus Pugin making an important contribution to its Gothic appearance and detailed interiors. Pointed arches, towers and elaborate decoration gave the new building a strong connection with older architectural traditions, even though much of it was created in the nineteenth century."],["A palace used for public business","The building is called a palace, but its best-known modern role is parliamentary. The House of Commons and the House of Lords meet in separate chambers, where members debate issues and examine legislation. Its corridors and ceremonial spaces also form part of the work of the institution. The riverside exterior presents one grand composition, while the interior contains many different working spaces."]]},"q":{"source":"https://www.queenelizabetholympicpark.co.uk/explore-park/parklands-and-playgrounds/waterways-and-rivers-water-activities","sections":[["Transforming east London","The preparations for the 2012 Games changed an area with a long industrial history. Waterways that had served factories and transport were cleaned and repaired. Paths and public spaces created new connections across the area. The aim extended beyond the sporting event itself: the site needed a useful future after athletes and spectators had gone home."],["Understanding an Olympic legacy","The word legacy describes what an event leaves behind. At the park, that includes sporting venues, green spaces, wildlife habitats and opportunities for everyday recreation. The contrast between large stadium structures and quieter riverside paths is especially noticeable. The area provides a clear example of how city planning can try to combine an international event with longer-term benefits for local communities."]]},"r":{"source":"https://www.romanbaths.co.uk/walkthrough","sections":[["A sacred place as well as a bath-house","The Romans knew the settlement as Aquae Sulis. A temple dedicated to Sulis Minerva stood close to the hot spring, connecting local and Roman religious traditions. People offered objects to the goddess and visited the bathing complex for reasons linked with health, social life and belief. The site was therefore more than an early version of a modern swimming pool."],["What the remains reveal","Water management was central to the complex. Roman engineers used channels, drains and pipes to direct the naturally hot water. Surviving objects, including coins and religious offerings, help explain how people used the site. Looking below the level of the modern city makes the passage of time especially clear: today’s Bath has grown around and above the remains of an ancient settlement."]]},"s":{"source":"https://www.nps.gov/stli/learn/statue-of-liberty-facts.htm","sections":[["A journey across the Atlantic","The statue was designed by the French sculptor Frédéric-Auguste Bartholdi, while Eiffel and Company worked on its supporting structure. Built in France, it was taken apart, transported across the Atlantic and assembled in New York. It was dedicated in 1886. The green colour familiar today developed naturally as the copper surface reacted with its environment."],["Symbols in the design","The torch represents enlightenment, while the tablet refers to the date of the American Declaration of Independence. Broken chains at the figure’s feet connect the statue with freedom from slavery. These details show that its meaning is built into the sculpture itself. Its position in the harbour later strengthened its association with immigration, opportunity and the experience of arriving in a new country."]]},"t":{"source":"https://www.timessquarenyc.org/nye/nye-history-times-square-ball","sections":[["How the square got its name","The area was previously known as Longacre Square. It received the name Times Square in 1904, connected with the arrival of The New York Times and its new headquarters. Transport, theatre and electric advertising helped turn the district into a centre of activity. Its identity developed through changing businesses and technology rather than one single monument."],["A famous countdown","New Year’s Eve celebrations began here in 1904, and the first ball descent took place in 1907. The tradition connected a public gathering with a highly visible signal marking the arrival of a new year. Outside the celebrations, the area remains closely associated with Broadway theatre and illuminated signs. Its constant movement makes it a useful contrast with the quieter spaces of nearby Central Park."]]},"u":{"source":"https://www.ucl.ac.uk/about/who-we-are/history","sections":[["A new idea in higher education","UCL was founded in 1826 with a vision of making university education available to a wider range of people. Its secular approach meant that admission was not tied to membership of a particular religion. It later played an important part in expanding opportunities for women. This history makes the institution significant for educational change as well as academic achievement."],["Architecture and modern research","The classical portico and dome give the main campus a formal appearance, but the university’s work reaches far beyond its historic buildings. Its departments cover subjects ranging from languages and law to engineering and medicine. Students and researchers work within the wider life of London. The campus therefore combines a recognisable architectural landmark with the less visible activity of developing and testing new ideas."]]},"v":{"source":"https://www.discoverlosangeles.com/things-to-do/things-to-do-in-venice-california","sections":[["The idea of a Venice in California","Developer Abbot Kinney founded Venice in 1905 as a seaside resort. Inspired by the Italian city, he created canals and brought gondolas into the area. Much of that original water network later disappeared as the neighbourhood changed, but a group of canals survives. This history explains why a district beside the Pacific Ocean carries the name of a European city."],["Different sides of one neighbourhood","The busy oceanfront, skateboarding spaces and outdoor exercise areas give Venice Beach an energetic character. The nearby canals offer a quieter contrast, with footbridges and residential streets. Artists and performers have also contributed to the area’s identity. Together, these settings show that Venice is more than a stretch of sand: it is a neighbourhood shaped by recreation, creative work and changing ideas about coastal living."]]},"w":{"source":"https://www.westminster-abbey.org/history/coronations-at-the-abbey/a-history-of-coronations","sections":[["A coronation church","Westminster Abbey has been associated with coronations since 1066, when William the Conqueror was crowned there. Much of the present Gothic building developed from the rebuilding begun under Henry III in 1245. Its architecture created space for both worship and major ceremonies. The building connects the religious meaning of these events with the public history of the monarchy."],["A place of national memory","The abbey also contains graves and memorials connected with writers, scientists, statesmen and other important figures. Some people are buried there, while others are remembered through monuments without being buried in the building. This distinction helps explain its role as a place of national memory. Despite its fame as a historic attraction, prayer and worship remain central to its purpose."]]},"x":{"source":"https://xavier.vic.edu.au/about-xavier/xavier-history","sections":[["A school with nineteenth-century roots","The Jesuits opened Xavier College in 1878. Its original Kew campus grew from a large site on Barkers Road, where the earliest buildings were developed before classes began. Later additions responded to the changing needs of students and teachers. The college’s history reflects the development of Catholic education in Melbourne and its links with the wider Jesuit educational tradition."],["The chapel and the campus","The Memorial Chapel is one of the most distinctive buildings at Xavier. It was created as a memorial to former students who died in the First World War. Its dome and classical details give it a different character from modern teaching buildings nearby. Seeing these structures together helps explain how an educational campus can preserve important memories while continuing to change and develop."]]},"y":{"source":"https://yorkminster.org/discover/interactive-map/","sections":[["Stone and glass as storytelling","Gothic architecture uses height, pointed arches and large windows to create an impression of space and light. At York Minster, stained glass adds another layer of meaning through figures, colours and religious stories. These windows are historic works of art as well as parts of the building. Caring for them requires specialist knowledge and patient work."],["The Chapter House","One especially notable space is the eight-sided Chapter House, which dates from the 1280s. Its roof is supported without a central column, leaving an open room beneath the vaulted ceiling. Carvings and stained glass reward close attention. The cathedral shows how engineering, artistic skill and religious purpose came together in medieval building, and why preserving such places involves many different crafts."]]},"z":{"source":"https://www.nps.gov/zion/learn/nature/geology.htm","sections":[["From ancient sand to sandstone","Some of Zion’s rock began as sand in an ancient desert. Over time, pressure and natural minerals helped turn loose material into solid sandstone. The land was later raised, and flowing water cut into the rock. These stages explain why the park contains both evidence of old desert environments and the deep canyons shaped by rivers."],["A landscape still being made","The Virgin River and its tributaries continue to carry material away from the canyon. Water also supports greener habitats that contrast with the surrounding dry slopes. Rockfalls, weather and erosion all contribute to ongoing change. Zion is a useful place to see that natural landmarks are not finished objects: the same forces that helped create them continue to act today."]]}};
const main=document.querySelector('main');let active='',query='',region='',type='';const photos={"g":"./7c4110976e6184cf.jpg","a":"./f2a8573b85ca94e8.jpg","b":"./9abfc3b34ac1a0db.jpg","c":"./9c2a6afbf0c55ab0.jpg","d":"./b3321c409094bc6e.jpg","e":"./c34395c54a18b1c5.jpg","f":"./62ec3de7fdc9c596.jpg","h":"./0153b19912729380.jpg","i":"./83f49b5ae24813f4.jpg","j":"./091c00113204ea20.jpg","k":"./8d33f79e4723315b.jpg","l":"./cc673d0264e0a982.jpg","m":"./385c1a4b1daca649.jpg","n":"./889432e46f3d162e.jpg","o":"./6f6559e8cf96f0fc.jpg","p":"./a1c49d6da92d72f4.jpg","q":"./135187f03896a6b7.jpg","r":"./01058e7aa96987a3.jpg","s":"./d9c533c278de157d.jpg","t":"./083391ace1e85f57.jpg","v":"./4fb2b5c8fc871d6e.jpg","w":"./78bc5555b67bf6cb.jpg","y":"./e4aaacdc4beda70e.jpg","z":"./268564a3f3840aa8.jpg","u":"./970096ad2691f435.jpg","x":"./0b5f1c1e6949cab0.jpg"};const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function photo(p,hero=false){return '<div class="'+(hero?'hero':'picture')+'"><span class="'+(hero?'heroletter':'bigletter')+'" aria-hidden="true">'+p.letter+'</span><img data-photo="'+p.id+'" alt="'+esc(p.name)+'" '+(hero?'':'loading="lazy"')+' src="'+esc(photos[p.id]||'')+'">'+(!hero?'<span class="smallletter">'+p.letter+'</span>':'')+'</div>'}
function attachPhotos(){document.querySelectorAll('[data-photo]').forEach(img=>{const url=photos[img.dataset.photo];if(url){img.onload=()=>{img.hidden=false};img.onerror=()=>{img.hidden=true};img.src=url;if(img.complete&&img.naturalWidth)img.hidden=false}})}
function cards(){const list=places.filter(p=>(!active||p.letter===active)&&(!region||p.region===region)&&(!type||p.type===type)&&[p.name,p.location,p.subtitle,p.type].join(' ').toLowerCase().includes(query.toLowerCase()));document.getElementById('count').textContent=list.length+' of 26 landmarks';document.getElementById('grid').innerHTML=list.length?list.map(p=>'<a class="card" href="#place/'+p.id+'">'+photo(p)+'<div class="eyebrow">'+p.region+' · '+p.type+'</div><h3>'+p.name+'<span aria-hidden="true"><svg aria-hidden="true" class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M5 5h14v14"/></svg></span></h3><p>'+p.location+'</p></a>').join(''):'<p class="empty">No landmarks found. Try another search or reset the filters.</p>';document.querySelectorAll('[data-letter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.letter===active)));attachPhotos()}
function home(){document.title='Landmark Atlas — The world, from A to Z';const spot=places[6];main.innerHTML='<section class="intro"><div><div class="eyebrow">● An alphabet of discovery</div><h1>The world,<br>from <em>A to Z.</em></h1></div><div><p class="lead">Extraordinary places. Fascinating stories.<br>Explore 26 landmarks and discover the world, one letter at a time.</p><a class="underlink" href="#explore">Find your next discovery <span><svg aria-hidden="true" class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19h14V5"/></svg></span></a></div></section><section class="hero" aria-label="Grand Canyon spotlight"><span class="heroletter" aria-hidden="true">G</span><img data-photo="g" alt="Grand Canyon" src="./7c4110976e6184cf.jpg"><div class="herotop"><span class="pill">IN THE SPOTLIGHT</span><span>07 / 26 — THE COLLECTION</span></div><div class="herotext"><div class="eyebrow">ARIZONA · USA</div><h2>Grand Canyon</h2><p>A landscape written in layers.</p></div><a class="herolink" href="#place/g" aria-label="Read about Grand Canyon"></a></section><div class="strip"><span>A CLOSER LOOK AT OUR WORLD</span><span>History · Architecture · Nature</span></div><section id="explore" class="collection"><div class="sectionhead"><div><div class="eyebrow">THE COLLECTION / A—Z</div><h2>A letter. A new perspective.</h2></div><p>Pick a letter. Follow your curiosity.</p></div><div class="filters"><label><span class="sr">Search landmarks</span><input id="search" placeholder="Search a landmark, city or country…" type="search" value="'+esc(query)+'"></label><label><span class="sr">Filter by region</span><select id="region"><option value="">All regions</option>'+[...new Set(places.map(p=>p.region))].map(x=>'<option '+(x===region?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label><span class="sr">Filter by type</span><select id="type"><option value="">All types</option>'+[...new Set(places.map(p=>p.type))].map(x=>'<option '+(x===type?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><div class="alphabet" role="group" aria-label="Filter by initial letter">'+['',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(x=>'<button data-letter="'+x+'" aria-pressed="false">'+(x||'All')+'</button>').join('')+'</div><div class="results"><span id="count" role="status"></span><button class="reset" id="reset">Reset filters <svg aria-hidden="true" class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M19 12a7 7 0 1 0-2 5M20 12l-3-7"/></svg></button></div><div id="grid" class="grid"></div></section><section class="about" id="about"><div><div class="eyebrow">MORE THAN A POSTCARD</div><h2>Every place has<br>a story to tell.</h2></div><div><p>This A–Z collection is an English learning project. Discover places in the United Kingdom, the United States and Australia through short, accessible readings.</p><p>Explore cities, museums, natural landscapes and places of learning. Open any entry to read its story and find a link to an official source.</p><p class="sources-note">Photographs are stored with the atlas. Wikimedia Commons image information is available through the further-reading links. UCL and Xavier College photographs come from their official websites.</p></div></section>';cards();document.getElementById('search').addEventListener('input',e=>{query=e.target.value;cards()});document.getElementById('region').addEventListener('change',e=>{region=e.target.value;cards()});document.getElementById('type').addEventListener('change',e=>{type=e.target.value;cards()});document.querySelectorAll('[data-letter]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.letter;cards()}));document.getElementById('reset').addEventListener('click',()=>{active=query=region=type='';home();document.getElementById('explore').scrollIntoView()});}
function detail(p){document.title=p.name+' — Landmark Atlas';const i=places.indexOf(p),prev=places[(i+25)%26],next=places[(i+1)%26];main.innerHTML='<section class="detail"><a class="back" href="#explore"><svg aria-hidden="true" class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m7-7-7 7 7 7"/></svg> Back to the collection</a><div class="eyebrow">'+p.letter+' / '+p.region+' / '+p.type+'</div><h1>'+p.name+'</h1><p class="lead">'+p.subtitle+'</p>'+photo(p,true)+'<div class="reading"><article><p>'+p.text+'</p><p>'+p.more+'</p>'+extendedStories[p.id].sections.map(s=>'<h2>'+esc(s[0])+'</h2><p>'+esc(s[1])+'</p>').join('')+'<div class="readmore"><a href="'+(extendedStories[p.id].source||p.source)+'" target="_blank" rel="noopener noreferrer">Official source <svg aria-hidden="true" class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M5 5h14v14"/></svg></a><a href="https://en.wikipedia.org/wiki/'+encodeURIComponent(p.wiki.replaceAll(' ','_'))+'" target="_blank" rel="noopener noreferrer">Further reading & image credits <svg aria-hidden="true" class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M5 5h14v14"/></svg></a></div></article><aside><h3>At a glance</h3><dl><dt>Location</dt><dd>'+p.location+'</dd><dt>Region</dt><dd>'+p.region+'</dd><dt>Category</dt><dd>'+p.type+'</dd><dt>Letter</dt><dd>'+p.letter+' of the alphabet</dd></dl></aside></div><nav class="neighbors" aria-label="Previous and next landmark"><a href="#place/'+prev.id+'"><svg aria-hidden="true" class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m7-7-7 7 7 7"/></svg> '+prev.name+'</a><a href="#place/'+next.id+'">'+next.name+' <svg aria-hidden="true" class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></a></nav></section>';attachPhotos();window.scrollTo(0,0)}
function route(){const id=location.hash.startsWith('#place/')?location.hash.slice(7):'';const p=places.find(x=>x.id===id);if(p){detail(p);return}home();if(location.hash==='#explore'||location.hash==='#about')requestAnimationFrame(()=>document.querySelector(location.hash)?.scrollIntoView())}window.addEventListener('hashchange',route);route();
</script></body></html>
